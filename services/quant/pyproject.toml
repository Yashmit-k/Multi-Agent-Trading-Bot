[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-agents"
version = "1.0.0"
description = "Quantitative trading agents that consume Core FeatureSet values"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115,<1",
    "joblib>=1.4",
    "core-features",
    "numpy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
train = [
    "pyarrow>=17",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pyarrow>=17",
]

[project.scripts]
quant-train = "quant_agents.ml.train:main"
quant-experiment = "quant_agents.ml.experiment:main"
quant-experiment-a = "quant_agents.ml.experiment_a:main"
quant-service = "quant_agents.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_agents"]

[tool.hatch.build.targets.wheel.sources]
"src/quant_agents" = "quant_agents"

[tool.pytest.ini_options]
# Some research modules reuse Core's backtest and cost code, so the Core packages are on the path too (as in the root
# pytest.ini).
pythonpath = [
    "src",
    "../../packages/contracts/src",
    "../core/db/src",
    "../core/candle-engine/src",
    "../core/feature-engine/src",
    "../core/signal-ingestion/src",
    "../core/market-data/src",
    "../core/worker/src",
    "../core/api/src",
    "../core/signal-fusion/src",
    "../core/decision-engine/src",
    "../core/risk-engine/src",
    "../core/paper-execution/src",
]
testpaths = ["tests"]
markers = [
    "integration: requires core_features; excluded by default",
]
addopts = "-m 'not integration'"
