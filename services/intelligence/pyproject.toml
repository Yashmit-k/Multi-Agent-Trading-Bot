[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelligence-agents"
version = "1.0.0"
description = "News and fundamental intelligence agents that emit AgentSignal"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "defusedxml>=0.7",
    "fastapi>=0.115,<1",
    "httpx>=0.27",
    "uvicorn>=0.32",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
intelligence-service = "intelligence_agents.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence_agents"]

[tool.hatch.build.targets.wheel.sources]
"src/intelligence_agents" = "intelligence_agents"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live_llm: optional real-provider smoke; skipped unless INTELLIGENCE_LIVE_LLM=1",
]
