[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-risk"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["contracts"]

[tool.hatch.build.targets.wheel]
packages = ["src/core_risk"]

[tool.hatch.build.targets.wheel.sources]
"src/core_risk" = "core_risk"
