[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "core-candles",
    "core-db",
    "core-features",
    "core-ingestion",
    "core-market-data",
    "core-worker",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "redis>=5",
    "uvicorn>=0.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core_api"]

[tool.hatch.build.targets.wheel.sources]
"src/core_api" = "core_api"
