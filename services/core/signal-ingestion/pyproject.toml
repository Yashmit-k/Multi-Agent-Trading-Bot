[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-ingestion"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["contracts", "core-db"]

[tool.hatch.build.targets.wheel]
packages = ["src/core_ingestion"]

[tool.hatch.build.targets.wheel.sources]
"src/core_ingestion" = "core_ingestion"
