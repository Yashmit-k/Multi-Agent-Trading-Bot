[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-worker"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["contracts", "core-db", "core-candles", "core-features"]

[tool.hatch.build.targets.wheel]
packages = ["src/core_worker"]

[tool.hatch.build.targets.wheel.sources]
"src/core_worker" = "core_worker"
