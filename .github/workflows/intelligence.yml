name: intelligence

on:
  push:
  pull_request:

jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install intelligence
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/contracts[dev]"
          python -m pip install -e "services/intelligence[dev]"
      - name: Unit tests
        run: python -m pytest services/intelligence/tests -q
