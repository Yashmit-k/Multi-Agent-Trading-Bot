name: contracts-and-core

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core -d core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://core:core@localhost:5432/core
      MAX_CLOCK_SKEW_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/contracts[dev]"
          python -m pip install psycopg[binary] httpx
          python -m pip install -e services/core/db
          python -m pip install -e services/core/candle-engine
          python -m pip install -e services/core/feature-engine
          python -m pip install -e services/core/signal-ingestion
          python -m pip install -e services/core/market-data
          python -m pip install -e services/core/signal-fusion
          python -m pip install -e services/core/decision-engine
          python -m pip install -e services/core/risk-engine
          python -m pip install -e services/core/paper-execution
          python -m pip install -e services/core/worker
          python -m pip install -e services/core/api
      - name: Test
        run: python -m pytest -q --ignore=services/intelligence
