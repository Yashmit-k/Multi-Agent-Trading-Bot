<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <style>
      .box{stroke:#374151;stroke-width:1.2;rx:8}
      .src{fill:#f3f4f6}.quant{fill:#dbeafe}.llm{fill:#ede9fe}.core{fill:#e0f2fe}.db{fill:#fef3c7}
      .orch{fill:#ecfdf5}.stage{fill:#d1fae5}.pm{fill:#ffedd5}.bus{fill:#fee2e2}.ui{fill:#f3f4f6}
      .t{font-weight:600;fill:#111827}.s{fill:#374151;font-size:11.5px}.l{fill:#1f2937;font-size:11px}
      .ln{stroke:#374151;stroke-width:1.4;fill:none}.dash{stroke-dasharray:5 4}
    </style>
  </defs>

  <!-- row 1: sources -->
  <rect class="box src" x="20" y="20" width="220" height="56"/><text class="t" x="130" y="43" text-anchor="middle">Zerodha Kite (read-only)</text><text class="s" x="130" y="62" text-anchor="middle">daily + 5-minute candles</text>
  <rect class="box src" x="260" y="20" width="220" height="56"/><text class="t" x="370" y="43" text-anchor="middle">16 public RSS feeds</text><text class="s" x="370" y="62" text-anchor="middle">ET · Mint · BS · CNBC-TV18 …</text>
  <rect class="box src" x="500" y="20" width="220" height="56"/><text class="t" x="610" y="43" text-anchor="middle">Yahoo Finance</text><text class="s" x="610" y="62" text-anchor="middle">fundamentals, weekdays 20:30 IST</text>
  <rect class="box src" x="760" y="20" width="220" height="56"/><text class="t" x="870" y="43" text-anchor="middle">Google Gemini</text><text class="s" x="870" y="62" text-anchor="middle">OpenAI-compatible API</text>

  <!-- row 2: specialists -->
  <rect class="box quant" x="20" y="130" width="330" height="88"/>
  <text class="t" x="185" y="152" text-anchor="middle">5 quant agents · rules 1.4.0</text>
  <text class="s" x="185" y="172" text-anchor="middle">technical · momentum · mean reversion</text>
  <text class="s" x="185" y="188" text-anchor="middle">volume · market regime</text>
  <text class="s" x="185" y="206" text-anchor="middle">containers quant (daily) + quant-intraday (5-min)</text>
  <rect class="box llm" x="400" y="130" width="330" height="88"/>
  <text class="t" x="565" y="152" text-anchor="middle">4 LLM agents · 1.1.0 (intelligence)</text>
  <text class="s" x="565" y="172" text-anchor="middle">news · fundamental · valuation · earnings</text>
  <text class="s" x="565" y="188" text-anchor="middle">every 600 s · model chain + labelled fallback</text>
  <text class="s" x="565" y="206" text-anchor="middle">POST /reassess: re-check on request</text>

  <!-- row 3: core, db, manager -->
  <rect class="box core" x="20" y="270" width="460" height="82"/>
  <text class="t" x="250" y="292" text-anchor="middle">core-api (FastAPI)</text>
  <text class="s" x="250" y="312" text-anchor="middle">market-data collector (every 20 s) · feature engine 1.2.0</text>
  <text class="s" x="250" y="330" text-anchor="middle">signal ingestion (validate · dedupe · point-in-time)</text>
  <text class="s" x="250" y="346" text-anchor="middle">review queue · manager tools · REST API</text>
  <rect class="box db" x="520" y="270" width="220" height="82"/>
  <text class="t" x="630" y="292" text-anchor="middle">PostgreSQL 16</text>
  <text class="s" x="630" y="310" text-anchor="middle">the blackboard: signals,</text>
  <text class="s" x="630" y="326" text-anchor="middle">proposals, reviews, risk, orders,</text>
  <text class="s" x="630" y="342" text-anchor="middle">fills, positions, system_events</text>
  <rect class="box pm" x="780" y="270" width="200" height="82"/>
  <text class="t" x="880" y="292" text-anchor="middle">Portfolio manager 1.0.0</text>
  <text class="s" x="880" y="310" text-anchor="middle">LLM supervisor, 8 tools</text>
  <text class="s" x="880" y="326" text-anchor="middle">plan · critique · re-check</text>
  <text class="s" x="880" y="342" text-anchor="middle">APPROVE / REDUCE / VETO</text>

  <!-- row 4: orchestrator -->
  <rect class="box orch" x="20" y="410" width="960" height="104"/>
  <text class="t" x="966" y="432" text-anchor="end">core-worker orchestrator · every 30 s · fixed order</text>
  <rect class="box stage" x="40" y="448" width="150" height="50"/><text class="t" x="115" y="470" text-anchor="middle">Fusion</text><text class="s" x="115" y="488" text-anchor="middle">Σwsc / Σwc</text>
  <rect class="box stage" x="225" y="448" width="150" height="50"/><text class="t" x="300" y="470" text-anchor="middle">Decision engine</text><text class="s" x="300" y="488" text-anchor="middle">BUY if S≥0.35, C≥0.4</text>
  <rect class="box stage" x="410" y="448" width="150" height="50"/><text class="t" x="485" y="470" text-anchor="middle">Review gate</text><text class="s" x="485" y="488" text-anchor="middle">waits ≤ 240 s</text>
  <rect class="box stage" x="595" y="448" width="160" height="50"/><text class="t" x="675" y="470" text-anchor="middle">Risk engine 1.3.0</text><text class="s" x="675" y="488" text-anchor="middle">up to 20 checks</text>
  <rect class="box stage" x="790" y="448" width="170" height="50"/><text class="t" x="875" y="470" text-anchor="middle">Paper execution</text><text class="s" x="875" y="488" text-anchor="middle">CNC limit · writes fills</text>
  <path class="ln" d="M190,473 H225" marker-end="url(#a)"/><path class="ln" d="M375,473 H410" marker-end="url(#a)"/>
  <path class="ln" d="M560,473 H595" marker-end="url(#a)"/><path class="ln" d="M755,473 H790" marker-end="url(#a)"/>

  <!-- row 5: bus, recorder, ui -->
  <rect class="box bus" x="20" y="580" width="600" height="56"/>
  <text class="t" x="320" y="602" text-anchor="middle">Redis 7 event bus · 10 channels</text>
  <text class="s" x="320" y="621" text-anchor="middle">agent · decision · review · risk · order · portfolio … .events (EventEnvelope)</text>
  <rect class="box ui" x="650" y="580" width="150" height="56"/><text class="t" x="725" y="602" text-anchor="middle">Trace recorder</text><text class="s" x="725" y="621" text-anchor="middle">→ system_events</text>
  <rect class="box ui" x="830" y="580" width="150" height="56"/><text class="t" x="905" y="602" text-anchor="middle">Website</text><text class="s" x="905" y="621" text-anchor="middle">Next.js + Caddy HTTPS</text>

  <!-- arrows: sources -->
  <path class="ln" d="M20,48 H8 V311 H20" marker-end="url(#a)"/>
  <path class="ln" d="M440,76 V130" marker-end="url(#a)"/><text class="l" x="446" y="106">articles</text>
  <path class="ln" d="M610,76 V130" marker-end="url(#a)"/><text class="l" x="616" y="106">metrics</text>
  <path class="ln" d="M790,76 L736,140" marker-start="url(#a)" marker-end="url(#a)"/><text class="l" x="770" y="118">JSON scores</text>
  <path class="ln" d="M930,76 V270" marker-start="url(#a)" marker-end="url(#a)"/><text class="l" x="936" y="200">tool calling</text>
  <!-- quant <-> core -->
  <path class="ln" d="M110,270 V218" marker-end="url(#a)"/><text class="l" x="116" y="250">FeatureSet</text>
  <path class="ln" d="M260,218 V270" marker-end="url(#a)"/><text class="l" x="266" y="250">AgentSignal</text>
  <!-- llm -> core -->
  <path class="ln" d="M440,218 V270" marker-end="url(#a)"/><text class="l" x="370" y="250">AgentSignal</text>
  <!-- core <-> db -->
  <path class="ln" d="M480,311 H520" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- manager -->
  <path class="ln" d="M800,270 V196 H730" marker-end="url(#a)"/><text class="l" x="740" y="190">agent.request → re-check</text>
  <path class="ln" d="M780,311 H740" marker-end="url(#a)"/><text class="l" x="744" y="368">reads via tools</text>
  <path class="ln" d="M485,448 V388 H880 V352" marker-start="url(#a)" marker-end="url(#a)"/><text class="l" x="600" y="382">review.requested → · ← verdict (shrink or veto only)</text>
  <!-- db -> fusion -->
  <path class="ln" d="M560,352 V372 H115 V448" marker-end="url(#a)"/><text class="l" x="125" y="366">newest valid opinion per agent</text>
  <!-- execution -> db -->
  <!-- events -->
  <path class="ln dash" d="M300,514 V580" marker-end="url(#a)"/><text class="l" x="306" y="548">every stage publishes</text>
  <path class="ln dash" d="M975,352 V540 H560 V580" marker-end="url(#a)"/><text class="l" x="700" y="534">review.step · review.completed</text>
  <path class="ln dash" d="M20,340 H13 V608 H20" marker-end="url(#a)"/><text class="l" x="26" y="566">agent.signal</text>
  <path class="ln" d="M620,608 H650" marker-end="url(#a)"/>
  <path class="ln" d="M800,608 H830" marker-end="url(#a)"/>
  <text class="s" x="20" y="670">Solid: requests and data. Dashed: events on the bus. Every message carries a correlation_id (the proposal id for a trade).</text>
</svg>
