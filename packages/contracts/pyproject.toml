[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contracts"
version = "1.0.0"
description = "Shared schemas, events, and interfaces for the multi-agent Indian equities trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2,<0.143",
    "pydantic>=2.13.5,<2.14",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]

[tool.hatch.build.targets.wheel.sources]
"src/contracts" = "contracts"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
